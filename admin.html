<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Discover Pakistan Tourism</title>
<style>
:root{--bg:#f3f5f2;--text:#13241f;--muted:#55645d;--card:#fff;--line:#dbe1da;--accent:#8a6a2a}
@media (prefers-color-scheme:dark){:root{--bg:#0b1613;--text:#e7eee9;--muted:#9db0a6;--card:#11201c;--line:#24382f;--accent:#e0bf7a}}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif;padding:16px}
.card{max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
h1{font-size:22px;margin:0 0 8px}p{margin:0;color:var(--muted)}a{color:var(--accent);font-weight:700}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="card">
  <h1>Owner dashboard</h1>
  <p id="msg">The dashboard runs on the booking server. Opening it now.</p>
</div>
<script>
  var base = String((window.DP_CONFIG || {}).apiBase || "").replace(/\/+$/, "");
  if (/^https:\/\//.test(base)) { location.replace(base + "/admin"); }
  else { document.getElementById("msg").innerHTML = "The booking server is not connected yet. Add its address to <b>config.js</b> (see the README)."; }
</script>
</body>
</html>
